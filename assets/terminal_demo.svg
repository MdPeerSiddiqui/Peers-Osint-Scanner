<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="850" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;display=swap');
      .term-bg { fill: #0d1117; rx: 12px; }
      .header-bg { fill: #161b22; }
      .text-title { font-family: 'Fira Code', monospace; font-size: 13px; fill: #8b949e; text-anchor: middle; }
      .cmd-text { font-family: 'Fira Code', monospace; font-size: 13.5px; fill: #58a6ff; font-weight: 600; }
      .banner { font-family: 'Fira Code', monospace; font-size: 11px; fill: #38bdf8; font-weight: 700; }
      .banner-sub { font-family: 'Fira Code', monospace; font-size: 11px; fill: #eab308; font-weight: 600; }
      .sub-dim { font-family: 'Fira Code', monospace; font-size: 10.5px; fill: #8b949e; }
      .t-green { fill: #3fb950; font-weight: 600; }
      .t-white { fill: #f0f6fc; }
      .t-cyan { fill: #56d4dd; }
      .t-yellow { fill: #d29922; }
      .t-dim { fill: #6e7681; }

      /* Animation Stages */
      .step0 { animation: fadeIn 0.4s ease forwards; }
      .step1 { opacity: 0; animation: fadeIn 0.5s ease 0.8s forwards; }
      .step2 { opacity: 0; animation: fadeIn 0.5s ease 1.6s forwards; }
      .step3 { opacity: 0; animation: fadeIn 0.5s ease 2.6s forwards; }
      .step4 { opacity: 0; animation: fadeIn 0.5s ease 3.4s forwards; }
      .step5 { opacity: 0; animation: fadeIn 0.5s ease 4.2s forwards; }
      .step6 { opacity: 0; animation: fadeIn 0.5s ease 5.0s forwards; }
      .cursor { animation: blink 1s infinite; fill: #58a6ff; }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="850" height="520" class="term-bg" stroke="#30363d" stroke-width="1.5"/>

  <!-- Terminal Header / Titlebar -->
  <path d="M 0 12 Q 0 0 12 0 L 838 0 Q 850 0 850 12 L 850 38 L 0 38 Z" class="header-bg"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="19" r="6" fill="#27c93f"/>
  <text x="425" y="24" class="text-title">peer@sqrock-cybersec: ~/Peers-Osint-Scanner</text>

  <!-- Terminal Content -->
  <g transform="translate(30, 65)">
    <!-- Command Execution -->
    <g class="step0">
      <text x="0" y="0" class="cmd-text"><tspan fill="#3fb950">peer@sqrock:~$</tspan> python peers_scanner.py google.com</text>
    </g>

    <!-- ASCII Banner -->
    <g class="step1" transform="translate(0, 20)">
      <text x="0" y="0" class="banner"> ____  _____ _____ ____  ____     ___  ____ ___ _   _ _____ </text>
      <text x="0" y="14" class="banner">|  _ \| ____| ____|  _ \/ ___|   / _ \/ ___|_ _| \ | |_   _|</text>
      <text x="0" y="28" class="banner">| |_) |  _| |  _| | |_) \___ \  | | | \___ \| ||  \| | | |  </text>
      <text x="0" y="42" class="banner">|  __/| |___| |___|  _ &lt; ___) | | |_| |___) | || |\  | | |  </text>
      <text x="0" y="56" class="banner">|_|   |_____|_____|_| \_\____/   \___/|____/___|_| \_| |_|  </text>
      <text x="0" y="74" class="banner-sub">⚡ PEER'S OSINT SCANNER v1.0 — Passive Reconnaissance Suite ⚡</text>
      <text x="0" y="90" class="sub-dim">[★] Developed for Sqrock IT Solution | Alpha 2 Cybersecurity Track</text>
      <text x="0" y="104" class="t-dim">─────────────────────────────────────────────────────────────────────────────</text>
    </g>

    <!-- Target Identified -->
    <g class="step2" transform="translate(0, 142)">
      <text x="0" y="0" class="cmd-text"><tspan class="t-green">[*] TARGET IDENTIFIED :</tspan> <tspan class="t-white">google.com</tspan> <tspan class="t-dim">(Domain Name)</tspan></text>
      <text x="0" y="18" class="cmd-text"><tspan class="t-green">[*] TIME OF SCAN      :</tspan> <tspan class="t-dim">2026-10-20 13:24:07 UTC</tspan></text>
    </g>

    <!-- Step 1: DNS -->
    <g class="step3" transform="translate(0, 185)">
      <text x="0" y="0" class="cmd-text"><tspan class="t-yellow">[1] RESOLVING DNS &amp; HOST ROUTING...</tspan></text>
      <text x="15" y="18" class="cmd-text"><tspan class="t-green">[+] Resolved IPv4    :</tspan> <tspan class="t-white">142.250.77.142</tspan></text>
    </g>

    <!-- Step 2: WHOIS -->
    <g class="step4" transform="translate(0, 230)">
      <text x="0" y="0" class="cmd-text"><tspan class="t-yellow">[2] QUERYING WHOIS REGISTRATION INTELLIGENCE...</tspan></text>
      <text x="15" y="18" class="cmd-text"><tspan class="t-green">[+] Registrar        :</tspan> <tspan class="t-white">MarkMonitor, Inc.</tspan></text>
      <text x="15" y="36" class="cmd-text"><tspan class="t-green">[+] Expiration Date  :</tspan> <tspan class="t-white">2028-09-14</tspan>  <tspan class="t-green">[+] NameServers:</tspan> <tspan class="t-dim">NS1, NS2, NS3.GOOGLE.COM</tspan></text>
    </g>

    <!-- Step 3: Geolocation -->
    <g class="step5" transform="translate(0, 292)">
      <text x="0" y="0" class="cmd-text"><tspan class="t-yellow">[3] GEOLOCATION, ASN &amp; INFRASTRUCTURE DATA...</tspan></text>
      <text x="15" y="18" class="cmd-text"><tspan class="t-green">[+] Location         :</tspan> <tspan class="t-white">Mountain View, California (US)</tspan></text>
      <text x="15" y="36" class="cmd-text"><tspan class="t-green">[+] Organization     :</tspan> <tspan class="t-white">Google LLC</tspan>  <tspan class="t-green">[+] ASN:</tspan> <tspan class="t-white">AS15169 Google LLC</tspan></text>
      <text x="15" y="54" class="cmd-text"><tspan class="t-cyan">[i] Cloud Provider   :</tspan> <tspan class="t-cyan">Google Cloud Infrastructure</tspan></text>
    </g>

    <!-- Success & Output -->
    <g class="step6" transform="translate(0, 375)">
      <text x="0" y="0" class="t-dim">─────────────────────────────────────────────────────────────────────────────</text>
      <text x="0" y="18" class="cmd-text"><tspan class="t-green">✔ SCAN COMPLETED SUCCESSFULLY</tspan></text>
      <text x="0" y="36" class="cmd-text"><tspan class="t-white">[★] Structured JSON Deliverable :</tspan> <tspan class="t-green">reports/peers_scan_google.com.json</tspan></text>
      <text x="0" y="58" class="cmd-text"><tspan fill="#3fb950">peer@sqrock:~$</tspan> <rect x="145" y="46" width="9" height="15" class="cursor"/></text>
    </g>
  </g>
</svg>
